id: ARTIFACT-20260822-032
type: failed_argument
title: Coalescing first-conormal zeros does not by itself supply positive p2
content: |
  A plausible repair of the ordinary-node obstruction was to merge several simple
  zeros of the first conormal divisor H into one multiple zero, hoping that the
  resulting worse surface singularity would contribute to p2. The controlled
  B=t collision in ARTIFACT-20260822-031 refutes that mechanism in its most
  direct form: a fivefold zero creates p1=5, but the chosen first blowup is smooth
  at the distinguished section, hence the local contribution is (5) and p2=0.

  The underlying pattern is compatible with Jaffe's balanced A_{2m-1,m} pairs:
  phi(2m-1,m)=(m). Thus a high ADE label or a high root multiplicity can still be
  completely concentrated in p1. For the displayed quartic the three residual
  simple roots add only A_{1,1} contributions, leaving total type (8), which
  fails the required p2>=7 in the p1=8 branch.

  This is not a proof that every repeated root in M8 or M9 has p2=0. It only
  eliminates the simple "coalesce H and keep the same conormal direction"
  mechanism. A future successful search must force the first strict transform to
  remain singular along its section, for example through an unbalanced A_{n,k}
  pair or a more general non-rational germ.
