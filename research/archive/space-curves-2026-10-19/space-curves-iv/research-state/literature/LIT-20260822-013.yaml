content: |
  In characteristic zero, Jaffe classifies a local-geometric pair consisting of
  a rational double point surface and a smooth curve on it. For an A_n surface
  singularity, the pair is A_{n,k}; its iterated blowup type is phi(n,k).
  Since phi(1,1)=(1), an ordinary double point A_1 met by a smooth curve has
  local type contribution (1), with all subsequent entries zero. The global type
  is the sum of these local contributions.

  This is a local statement. It does not assert that an arbitrary globally
  defined surface with nodes is an s.t.c.i. member, nor does it control
  non-rational or non-isolated surface singularities.
relevant_results_or_ideas:
  - An A_1 point on C contributes one unit to p1 and nothing to p2,p3,... .
  - The type depends on the surface--curve pair, not merely the ADE label in general.
  - Higher p_i can therefore distinguish an ordinary-node exceptional divisor from a viable certificate singularity configuration.
unresolved_questions:
  - Which non-A_1 local pairs can occur on the determinantal exceptional quartic locus?
  - Can their summed type meet the degree-(4,5) inequalities while remaining compatible with the length-five transverse intersection?
