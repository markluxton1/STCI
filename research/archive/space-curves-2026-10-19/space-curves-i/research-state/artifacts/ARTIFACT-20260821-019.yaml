id: ARTIFACT-20260821-019
type: theorem
title: "Nodal-cubic obstruction: a quintic avoiding an A1 node leaves a complete disjoint degree-one curve"
content: >-
  Let X be an integral cubic surface over an algebraically closed
  characteristic-zero field with exactly one A1 singular point p. Let C be a
  smooth irreducible rational curve of degree five on X avoiding p. Then X-C
  contains a complete degree-one curve, and is therefore not affine. In
  particular, all three explicit normal one-nodal Vahlen cubic witnesses in
  ARTIFACT-20260821-018 have non-affine complement.

  Proof route. On the crepant minimal resolution pi:S->X, put H=-K_S and let
  E be the contracted (-2)-curve. Since C avoids p, its strict transform D is
  disjoint from E; adjunction gives H.D=5 and D^2=3. The 15 simple (-1)-curves
  are disjoint from E and descend to lines not through p. Since D is
  irreducible and distinct from each such curve, its intersection with each is
  nonnegative. In the E6 lattice, after a Weyl marking of E, exact enumeration
  of every integral D satisfying these degree, square, orthogonality, and
  nonnegativity conditions finds 120 numerical classes; every one is
  disjoint from exactly three simple-line classes. At least one corresponding
  degree-one image curve on X is complete and disjoint from C, precluding
  affineness.

  The finite enumeration and standard resolution facts are recorded below and
  independently reconstructed in ARTIFACT-20260821-020. It applies only to
  cubic surfaces with exactly one A1 singularity and to a curve avoiding that
  node; it neither classifies all singular cubics in I_C(3) nor settles
  Hartshorne--Polini Question 7.5.
