id: ARTIFACT-20260821-020
type: theorem
title: "Independent verification: one-nodal cubic quintic boundaries have a complete degree-one obstruction"
content: >-
  Independently reconstructing ARTIFACT-20260821-019, let pi:S->X be the
  minimal resolution of an integral cubic surface with one A1 point and let E
  be its contracted (-2)-curve. If C is a smooth rational degree-five curve
  avoiding the node, its strict transform D has H.D=5, D^2=3, and D.E=0 for
  H=-K_S. In the E6 lattice, choose a root representative alpha for E. Among
  the 27 numerical (-1)-classes, exactly 15 satisfy alpha.L=0. Each is
  effective without any line-correspondence assumption: Riemann--Roch gives
  chi(O_S(L))=1, while H.(K_S-L)<0 gives h2(L)=0, hence h0(L)>=1. Since H.L=1,
  its effective divisor has a noncontracted degree-one component whose image
  on X is a complete line.

  The strict transform D is distinct from every such degree-one divisor, so
  D.L>=0. Exact finite enumeration of all integral D with H.D=5, D^2=3,
  D.alpha=0, and these 15 nonnegativity inequalities finds 120 classes, each
  having intersection zero with exactly three alpha-orthogonal (-1)-classes.
  For any one of them, every component has nonnegative intersection with D and
  the total intersection is zero; the noncontracted degree-one component
  therefore maps to a complete line disjoint from C. Thus X-C is not affine.

  This verifies the candidate theorem in ARTIFACT-20260821-019. It applies to
  every integral one-A1 cubic and every eligible curve avoiding its node, so it
  covers the three exact Vahlen witnesses. It does not cover higher ADE types,
  multiple nodes, nonnormal cubics, or surfaces of degree at least four.
