id: ARTIFACT-20260821-023
type: computation
title: "Corrected Vahlen base-line coordinates and two exact singular-member incidence strata"
content: >-
  A direct reconstruction from the anticanonical parametrization corrects the
  displayed coordinate equations for the forced residual line G in
  ARTIFACT-20260821-013.  In the U0,U1,U2,U3 coordinates used by the binary
  quintic, the image of q=3yz-5xz-5xy+7x^2 is
  G=V(3U2-5U0, 3U3-5U0-5U1), not the two linear forms printed in that artifact.
  Exact substitution verifies that every cubic in I_C(3) vanishes on this
  corrected G; hence the base-line conclusion itself survives, but its prior
  coordinate display does not.

  This correction yields two certified partial strata of the cubic-system
  discriminant without attempting universal elimination.  Write a cubic member
  F as l1 Q1+l2 Q2 for l1=3U2-5U0 and l2=3U3-5U0-5U1.  Its singular points on
  G are precisely the common zeros of Q1|G and Q2|G.  Their binary-quadratic
  resultant is a nonzero homogeneous quartic R_G(a0,a1,a2,a3), computed exactly
  by the accompanying script.  Thus V(R_G) is exactly the locus of system
  members singular somewhere on G (with possible multiplicities and overlaps
  not yet stratified).

  Independently, the normal-gradient matrix of the four cubics along the
  parametrized quintic C has generic rank two: an explicit 2-by-2 minor is
  nonzero.  Hence, at a general point of C, the projectivized space of cubic
  members singular at that point is a P1.  This gives a two-dimensional
  base-curve singularity incidence in the coefficient P3.  It explains why a
  discriminant analysis must separate singularities on C and G from the
  off-base A1 witnesses already excluded by ARTIFACT-20260821-020.

  Neither result is a full factorization or stratification of the restricted
  cubic discriminant.  In particular, it does not determine the image degree
  or generic singularity type of the C-incidence surface, the factorization of
  R_G, its overlap with the C-incidence, or the remaining off-base component.

