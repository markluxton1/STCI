title: "Exact low-degree ideal of the coordinate Vahlen quintic and its forced residual line"
content: >-
  For the binary-quintic parametrization in ARTIFACT-20260821-012 over Q, exact
  substitution linear algebra gives dim I_C(1)=0, dim I_C(2)=0, dim I_C(3)=4,
  and dim I_C(4)=14; the corresponding image ranks are 4, 10, 16, and 21.
  Thus the parametrization has no linear or quadratic equations, and its first
  homogeneous ideal equations occur in degree 3. The four coordinate polynomials
  have gcd 1, and the exact identity
  (5U3-3U1)t=(5U3+5U2-3U0)s supplies a rational inverse on a nonempty open set.
  Together with the source divisor calculation H.C=5, this independently verifies
  that the model is a basepoint-free, birational degree-five P1 curve.

  The degree-three kernel is four-dimensional (an explicit Q-basis is emitted by
  research-state/scripts/vahlen_quintic_exact.py). The cited cubic-surface equation
  in ARTIFACT-20260821-012 belongs to this kernel. In degree 4, R_1 I_C(3) has rank
  13, so I_C(4) has exactly one new minimal quartic class; this is a degree-by-degree
  statement, not a claim that the displayed finite calculation generates the full
  saturated ideal in every degree.

  The residual conic through p2,...,p6 is q=7x^2-5xy-5xz+3yz. Its image is the
  line G=V(3U2-5U0, 3U3-5U0-5U1); these coordinates were corrected by an
  independent direct conic-image reconstruction in ARTIFACT-20260821-023.
  Direct substitution of every basis member of I_C(3) on this corrected line is
  zero. Therefore
  every cubic through the computed quintic contains G scheme-theoretically as a
  set (indeed its equation lies in I(G)); this independently confirms the common
  quadrisecant configuration in this coordinate model. The conclusion uses the
  source fact H.G=1 / the displayed blow-up interpretation to identify the conic's
  image as a line; it does not assert any uniqueness of Vahlen's historical model.

  Smoothness test: exact rational Gröbner-basis Jacobian checks on all four standard
  P3 charts gave the unit ideal for (i) the displayed cubic X and (ii) X plus the
  first exact cubic-kernel basis vector. Both sample cubic surfaces are smooth over
  an algebraic closure of Q. Consequently the P3 of cubics containing C has a
  nonempty Zariski-open smooth locus. This does not address affineness of X minus C,
  the analogous complement for another member, Q7.5, or radical generation by two
  forms.

  Concise next test: classify the residual scheme in the intersection of two
  independent members of I_C(3), separating the forced line G from the moving
  residual curve, and test whether any resulting smooth cubic can avoid a complete
  curve disjoint from C.

