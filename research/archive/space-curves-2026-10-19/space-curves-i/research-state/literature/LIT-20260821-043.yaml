content: >-
  The inspected section states that for a cubic surface with rational double
  points, the minimal resolution is crepant, is a weak del Pezzo surface, and
  its anticanonical complete linear system gives the cubic-surface contraction.
  It identifies the orthogonal complement of the canonical class with the E6
  root lattice and describes the contracted (-2)-curves by effective roots.
  These standard facts validate the resolution language used in the nodal
  boundary calculation, but do not themselves analyze Vahlen's curve.
relevant_results_or_ideas: ["A1 nodes correspond to a single contracted (-2)-curve on a weak degree-three del Pezzo resolution.", "The anticanonical morphism is crepant and contracts precisely the relevant root configuration.", "E6 lattice calculations can track lines that descend away from the node."]
