content: >-
  Hartshorne and Polini formulate an exact criterion: for a codimension-r
  projective variety, being a set-theoretic complete intersection is equivalent
  to vanishing of H^i_I(A) above r together with codepth r of H^r_I(A). For a
  curve in P3, quasi-cyclicity of H^2_I(A) is a necessary weaker condition.
  They explicitly say the exact criterion is impractical because finding the
  requisite coregular sequence is tantamount to finding the two equations.
  Their Question 7.5 asks for a containing surface X with X minus C affine;
  it is equivalent to codepth at least one. They record that the smooth rational
  quartic is the smallest characteristic-zero example of unknown s.t.c.i.
  status, while Questions 7.4 and 7.5 have affirmative answers for it; Vahlen's
  quintic is another example where the affine-complement question remains open.
relevant_results_or_ideas:
  - "Refined local cohomology is not merely a one-way vanishing obstruction; it has exact and graded necessary formulations."
  - "The exact module criterion shifts, but does not remove, the global equation-selection problem."
  - "Surface-complement affineness is a geometric intermediate question tied to the first layer of coregularity."
unresolved_questions:
  - "Can a necessary condition such as quasi-cyclicity be falsified on a concrete characteristic-zero curve?"
  - "Can the codepth/affine-complement ladder be evaluated on Vahlen's quintic or another structured candidate?"
  - "Can this module framework be connected to the multiple-structure taxonomy without rephrasing the same existential choice?"
