name: Ideal-filtration exact verification

on:
  pull_request:
    paths:
      - 'research/computations/verify_ideal_filtration_*.py'
      - 'research/computations/verify_delta_singular_*'
      - 'research/computations/verify_delta_conormal_annihilator_2026_10_24.m2'
      - 'research/arguments/filtered_equation_comparison.md'
      - 'research/arguments/normal_koszul_cancellation.md'
      - 'research/arguments/punctual_comparison_defects.md'
      - 'research/arguments/transverse_specialization.md'
      - 'scripts/research.py'
      - 'scripts/requirements-research.txt'
      - '.github/workflows/ideal-filtration-validation.yml'
  push:
    branches:
      - 'research/ideal-filtration-reconciliation-2026-10-24'
    paths:
      - '.github/workflows/ideal-filtration-validation.yml'
      - 'research/computations/verify_ideal_filtration_*.py'
      - 'research/computations/verify_delta_singular_*'
      - 'research/computations/verify_delta_conormal_annihilator_2026_10_24.m2'
  workflow_dispatch:

jobs:
  python-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r scripts/requirements-research.txt
      - name: Check exact arithmetic scripts and research record structure
        run: |
          set -euo pipefail
          python3 -B research/computations/verify_ideal_filtration_counterexamples_2026_10_23.py
          python3 -B research/computations/verify_ideal_filtration_completeness_2026_10_23.py
          python3 -B research/computations/verify_ideal_filtration_quartic_lifting_2026_10_23.py
          python3 -B research/computations/verify_delta_singular_identities_2026_10_24.py
          python3 -B scripts/research.py validate

  macaulay2-rees:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Macaulay2
        run: |
          sudo apt-get update
          sudo apt-get install -y macaulay2
      - name: Verify full Rees-saturated initial ideals
        run: |
          set -euo pipefail
          M2 --version
          M2 --script research/computations/verify_delta_singular_families_2026_10_24.m2
          M2 --script research/computations/verify_delta_conormal_annihilator_2026_10_24.m2
