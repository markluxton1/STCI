name: Result records and R-0025 independent replay
on:
  workflow_dispatch:
  push:
    branches:
      - research/promotion-adjudication-cr01-05-cr09-11-2026-10-26
    paths:
      - 'research/results/**'
      - 'research/computations/validate_result_records.py'
      - 'research/computations/endpoint4_fixed_jet_independent_2026_10_26.py'
      - '.github/workflows/result-records-and-r0025.yml'
jobs:
  validate-records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML
      - run: python research/computations/validate_result_records.py
  replay-r0025:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independently reconstruct 690x969 jet matrix and compute rank
        run: python research/computations/endpoint4_fixed_jet_independent_2026_10_26.py
      - name: Compare with saved independent certificate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('research/computations/endpoint4_fixed_jet_independent_2026_10_26.json')
          current = json.loads(path.read_text())
          assert current['matrix_shape'] == [690, 969]
          assert current['rank'] == 683
          assert current['kernel_dimension'] == 286
          assert current['all_286_known_multiples_annihilated_at_every_sample'] is True
          assert current['rank_683_target_met'] is True
          assert current['coefficient_matrix_sha256_native_uint32'] == 'a3e546424d11200e1d8075c7f9d5d342787bd925a303901bd2b33b2661f56445'
          print('PASS: rank, kernel, annihilation, matrix hash')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r0025-replay-output
          path: research/computations/endpoint4_fixed_jet_independent_2026_10_26.json
