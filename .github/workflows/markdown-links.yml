name: Markdown navigation links

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.markdown"
      - "scripts/check_markdown_links.py"
      - ".github/workflows/markdown-links.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.markdown"
      - "scripts/check_markdown_links.py"
      - ".github/workflows/markdown-links.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate current Markdown paths and heading fragments
        run: python3 scripts/check_markdown_links.py --anchors
