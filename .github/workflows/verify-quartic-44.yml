name: Verify quartic (4,4) research
on:
  pull_request:
    paths:
      - 'research/computations/verify_44_filtered_contact_2026_10_23.py'
      - 'research/computations/audit_mf6_e1_primitive_2026_10_07.py'
      - 'research/arguments/quartic-specialization-controls.support/**'
      - 'research/arguments/quartic_specialization_and_symbols.md'
      - 'research/results/quartic_normal_initial_base_change.md'
      - 'research/results/quartic_actual_symbols.md'
      - 'research/results/quartic_pair_normal_order_reduction.md'
      - 'research/arguments/normal-geometry/quartic_pair_obstruction.md'
      - 'research/results/quartic_44_filtered_exclusion.md'
      - 'research/results/quartic_conormal_characteristic_jump.md'
      - 'research/results/quartic_mu4_degeneration.md'
      - '.github/workflows/verify-quartic-44.yml'
  workflow_dispatch:
jobs:
  exact-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'sympy==1.14.0'
      - name: Replay quartic Python verifiers and false controls
        run: python -m unittest discover -s research/arguments/quartic-specialization-controls.support -k _python -v
      - name: Verify filtered contact
        run: python research/computations/verify_44_filtered_contact_2026_10_23.py
      - name: Verify inherited e1 classification
        run: |
          set -euo pipefail
          cp research/computations/audit_mf6_e1_primitive_2026_10_07.py "$RUNNER_TEMP/"
          python "$RUNNER_TEMP/audit_mf6_e1_primitive_2026_10_07.py"
  macaulay2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Macaulay2
        run: |
          sudo apt-get update
          sudo apt-get install -y macaulay2
      - name: Replay quartic Macaulay2 verifiers and false controls
        run: python3 -m unittest discover -s research/arguments/quartic-specialization-controls.support -k _m2 -v
