name: Canonical research records
on:
  pull_request:
    paths:
      - "research/results/**"
      - "research/questions/**"
      - "research/computations/validate_records.py"
      - ".github/workflows/research-records.yml"
  push:
    branches: [main]
    paths:
      - "research/results/**"
      - "research/questions/**"
      - "research/computations/validate_records.py"
      - ".github/workflows/research-records.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 research/computations/validate_records.py
