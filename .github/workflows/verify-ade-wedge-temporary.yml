name: Temporary ADE wedge verification
on:
  push:
    branches:
      - chatgpt/toric-branch-research-state-reconciliation
  workflow_dispatch:
jobs:
  exact-rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact sextic audit
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 research/computations/audit_sextic_triple_spaces_2026_10_31.py | tee /tmp/ade-wedge-output.txt
          grep 'Omega_3:' /tmp/ade-wedge-output.txt
